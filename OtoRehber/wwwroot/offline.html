<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Çevrimdışısınız - OtoRehber</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f9fafb;
            color: #1f2937;
        }
        .card {
            max-width: 26rem;
            width: 100%;
            text-align: center;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 1rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }
        .icon {
            width: 4.5rem;
            height: 4.5rem;
            margin: 0 auto 1.25rem;
            border-radius: 1rem;
            background: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon svg { width: 2.5rem; height: 2.5rem; fill: #fff; }
        h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
        p { font-size: .95rem; line-height: 1.55; color: #6b7280; margin: 0 0 1.5rem; }
        button {
            appearance: none;
            border: 0;
            background: #2563eb;
            color: #fff;
            font-size: .95rem;
            font-weight: 600;
            padding: .75rem 1.5rem;
            border-radius: .625rem;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        @media (prefers-color-scheme: dark) {
            body { background: #111827; color: #f3f4f6; }
            .card { background: #1f2937; border-color: #374151; box-shadow: none; }
            p { color: #9ca3af; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg viewBox="0 0 640 512" aria-hidden="true"><path d="M171.3 96H224v96H111.3l30.4-75.9C146.5 104 158.2 96 171.3 96zM272 192V96h81.2c9.7 0 18.9 4.4 25 12l67.2 84H272zm256.2 1L428.2 68c-18.2-22.8-45.8-36-75-36H171.3c-39.3 0-74.6 23.9-89.1 60.3L40.6 196.4C16.8 205.8 0 228.9 0 256V368c0 17.7 14.3 32 32 32H65.3c7.6 45.4 47.1 80 94.7 80s87.1-34.6 94.7-80H385.3c7.6 45.4 47.1 80 94.7 80s87.1-34.6 94.7-80H608c17.7 0 32-14.3 32-32V320c0-65.2-48.8-119-111.8-127zM434.7 368a48 48 0 1 1 90.5 32 48 48 0 1 1 -90.5-32zM160 336a48 48 0 1 1 0 96 48 48 0 1 1 0-96z"/></svg>
        </div>
        <h1>İnternet bağlantısı yok</h1>
        <p>Şu anda çevrimdışısınız. OtoRehber içeriğini görüntülemek için internet bağlantınızı kontrol edip tekrar deneyin.</p>
        <button onclick="location.reload()">Yeniden dene</button>
    </div>
</body>
</html>
