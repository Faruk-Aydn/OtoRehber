name: CI

on:
  push:
    branches: [main, production-hazirlik]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore OtoRehber.sln

      - name: Build
        run: dotnet build OtoRehber.sln -c Release --no-restore

      - name: Test
        run: dotnet test OtoRehber.sln -c Release --no-build --verbosity normal

      - name: Docker build (smoke)
        run: docker build -t otorehber:ci .
