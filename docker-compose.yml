# Yerel/production benzeri çalıştırma: uygulama + PostgreSQL.
# Gizli değerler bu dosyaya YAZILMAZ; kök dizindeki .env dosyasından okunur
# (.env git'e gönderilmez). Örnek için .env.example'a bakın.
# Kullanım:  cp .env.example .env  → .env'i doldur  → docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: otorehber
      POSTGRES_USER: otorehber
      POSTGRES_PASSWORD: otorehber
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otorehber"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=otorehber;Username=otorehber;Password=otorehber"
      AllowedHosts: "*"
      # Gizli değerler .env dosyasından gelir (git'e gönderilmez):
      AdminSeed__Email: "${ADMIN_EMAIL:-admin@otorehber.com}"
      AdminSeed__Password: "${ADMIN_PASSWORD:-}"
      GeminiApiKey: "${GEMINI_API_KEY:-}"
      Resend__ApiKey: "${RESEND_API_KEY:-}"
      Resend__FromEmail: "${RESEND_FROM_EMAIL:-OtoRehber <onboarding@resend.dev>}"
    ports:
      - "8080:8080"

volumes:
  pgdata:
